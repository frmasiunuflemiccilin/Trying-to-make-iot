<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Suhu & Kelembapan - Dashboard</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border: 1px solid var(--border);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #0f172a;
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #1d4ed8;
    }

    button:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
      text-align: center;
    }

    .status-box.success {
      background-color: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .status-box.error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Monitoring IoT</h2>
    <p class="subtitle">Kirim data uji coba ke Google Sheets / Excel</p>

    <div class="form-group">
      <label for="suhu">Suhu (°C)</label>
      <input type="number" id="suhu" placeholder="Contoh: 28.5" step="0.1" required>
    </div>

    <div class="form-group">
      <label for="lembap">Kelembapan (%)</label>
      <input type="number" id="lembap" placeholder="Contoh: 65" step="1" required>
    </div>

    <button id="btnKirim" onclick="kirimData()">Kirim Data ke Excel</button>

    <div id="statusBox" class="status-box"></div>
  </div>

  <script>
    // ==========================================
    // PENTING: GANTI DENGAN URL WEB APP GAS-MU
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymam4fH-5k-DDt8Y1TaEFQ8h3CKONEoNEQW7HfabMiWKYVhzbtLy7dR_4bAjx2m5KIhQ/exec";
    const SECRET_TOKEN = "UnuHumidity2602";

    async function kirimData() {
      const suhu = document.getElementById("suhu").value;
      const lembap = document.getElementById("lembap").value;
      const statusBox = document.getElementById("statusBox");
      const btnKirim = document.getElementById("btnKirim");

      // Validasi input kosong
      if (!suhu || !lembap) {
        tampilkanStatus("Harap isi nilai suhu dan kelembapan!", "error");
        return;
      }

      // Ubah tombol jadi loading
      btnKirim.disabled = true;
      btnKirim.innerText = "Mengirim...";
      statusBox.style.display = "none";

      // Susun URL beserta parameter query
      const fullUrl = `${GAS_WEB_APP_URL}?token=${encodeURIComponent(SECRET_TOKEN)}&suhu=${encodeURIComponent(suhu)}&lembap=${encodeURIComponent(lembap)}`;

      try {
        const response = await fetch(fullUrl, {
          method: "GET",
          redirect: "follow" // Wajib ada untuk penanganan redirect dari Google Script
        });

        const result = await response.json();

        if (result.status === "Success") {
          tampilkanStatus("Data berhasil disimpan ke Excel!", "success");
          document.getElementById("suhu").value = "";
          document.getElementById("lembap").value = "";
        } else {
          tampilkanStatus(`Gagal: ${result.status} - ${result.message || ''}`, "error");
        }
      } catch (error) {
        console.error("Error:", error);
        tampilkanStatus("Terjadi kesalahan koneksi / CORS saat mengirim data.", "error");
      } finally {
        btnKirim.disabled = false;
        btnKirim.innerText = "Kirim Data ke Excel";
      }
    }

    function tampilkanStatus(pesan, tipe) {
      const statusBox = document.getElementById("statusBox");
      statusBox.innerText = pesan;
      statusBox.className = `status-box ${tipe}`;
      statusBox.style.display = "block";
    }
  </script>

</body>
    </html>
