<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Monitoring Suhu & Kelembapan</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
      max-width: 850px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .title-area h2 {
      font-size: 24px;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .title-area .status-text {
      font-size: 13px;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      display: inline-block;
    }

    button.btn-refresh {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-refresh:hover {
      background-color: var(--primary-hover);
    }

    button.btn-refresh:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .table-container {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow-x: auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #475569;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 32px;
      font-size: 15px;
      color: #64748b;
    }

    .error-msg {
      color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title-area">
      <h2>📊 Data Sensor IoT</h2>
      <div class="status-text">
        <span class="dot"></span>
        <span id="infoUpdate">Auto-refresh aktif (tiap 5 menit)</span>
      </div>
    </div>
    <button id="btnRefresh" class="btn-refresh" onclick="ambilData()">🔄 Refresh Sekarang</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Waktu (WITA/WIB)</th>
          <th>Suhu (°C)</th>
          <th>Kelembapan (%)</th>
        </tr>
      </thead>
      <tbody id="tabelData">
        <tr>
          <td colspan="3" class="loading">Memuat data terbaru dari Excel...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // ==========================================
    // PENTING: GANTI DENGAN URL WEB APP GAS-MU
    // ==========================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbymam4fH-5k-DDt8Y1TaEFQ8h3CKONEoNEQW7HfabMiWKYVhzbtLy7dR_4bAjx2m5KIhQ/exec";
    const SECRET_TOKEN = "UnuHumidity2602";

    // Interval Auto-Refresh: 5 Menit = 300.000 milidetik
    const INTERVAL_REFRESH = 300000; 

    // Otomatis ambil data saat halaman pertama kali terbuka & set interval 5 menit
    window.onload = function() {
      ambilData();
      setInterval(ambilData, INTERVAL_REFRESH);
    };

    async function ambilData() {
      const tabel = document.getElementById("tabelData");
      const btn = document.getElementById("btnRefresh");
      const infoUpdate = document.getElementById("infoUpdate");

      btn.disabled = true;
      btn.innerText = "⏳ Memuat...";

      // Hanya tampilkan teks loading kalau tabel masih kosong (supaya saat auto-refresh tabel tidak kedip-kedip hilang)
      if (tabel.children.length <= 1 && tabel.innerText.includes("Memuat")) {
        tabel.innerHTML = '<tr><td colspan="3" class="loading">Memuat data terbaru dari Excel...</td></tr>';
      }

      const fullUrl = `${GAS_WEB_APP_URL}?token=${encodeURIComponent(SECRET_TOKEN)}&action=read`;

      try {
        const response = await fetch(fullUrl, {
          method: "GET",
          redirect: "follow" // Wajib ada untuk penanganan redirect Google
        });

        const result = await response.json();

        if (result.status === "Success" && Array.isArray(result.data)) {
          tampilkanKeTabel(result.data);
          
          // Perbarui teks keterangan waktu pembaruan terakhir
          const jamSekarang = new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
          infoUpdate.innerText = `Terakhir diperbarui pukul ${jamSekarang} (Auto-refresh tiap 5 menit)`;
        } else {
          tabel.innerHTML = `<tr><td colspan="3" class="error-msg">Gagal memuat: ${result.message || 'Data tidak valid'}</td></tr>`;
        }
      } catch (error) {
        console.error("Error:", error);
        tabel.innerHTML = '<tr><td colspan="3" class="error-msg">Gagal menghubungi server Google Sheets / CORS error.</td></tr>';
      } finally {
        btn.disabled = false;
        btn.innerText = "🔄 Refresh Sekarang";
      }
    }

    function tampilkanKeTabel(data) {
      const tabel = document.getElementById("tabelData");
      tabel.innerHTML = "";

      if (data.length === 0) {
        tabel.innerHTML = '<tr><td colspan="3" class="loading">Belum ada data di Excel.</td></tr>';
        return;
      }

      // Tampilkan data ke dalam tabel
      data.forEach(baris => {
        const waktuRaw = baris[0];
        const suhu = baris[1] || "-";
        const lembap = baris[2] || "-";

        // Format tanggal & waktu ke standar lokal Indonesia
        let tanggalFormated = "-";
        try {
          tanggalFormated = new Date(waktuRaw).toLocaleString("id-ID", {
            dateStyle: "medium",
            timeStyle: "short"
          });
        } catch (e) {
          tanggalFormated = waktuRaw;
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${tanggalFormated}</td>
          <td><strong>${suhu} °C</strong></td>
          <td><strong>${lembap} %</strong></td>
        `;
        tabel.appendChild(tr);
      });
    }
  </script>

</body>
</html>
